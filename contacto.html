<main>

  <section><div class="container"><div class="split">
    <div class="glass card"><h3 data-lafanja="paginas.contacto.datosTitulo">Datos de contacto</h3>
      <ul class="info-list">
        <li><span data-lafanja="contacto.direccion">Aldea San Antonio Las Cuevas, Raxruhá, Alta Verapaz, Guatemala<br>
          <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Aldea+San+Antonio+Las+Cuevas+Raxruh%C3%A1+Alta+Verapaz">Ver en Google Maps</a></span></li>
        <li><span data-lafanja="contacto.telefonos"><a href="tel:+50240507209">4050-7209</a><br><a href="tel:+50240113693">4011-3693</a><br><a href="tel:+50237222616">3722-2616</a></span></li>

      </form></div>
  </div></div></section>
