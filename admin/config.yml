backend:
  name: github
  branch: main
  repo: "NELSONFER-8/multiservicios-la-franja"
  base_url: "https://lafranja.pages.dev"
  auth_endpoint: "/api/auth"

locale: es
media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "catalogo"
    label: "Productos"
    label_singular: "producto"
    description: "Precios, categorías, activos y destacados. Guarda para publicar los cambios en la web."
    icon: "inventory_2"
    files:
      - name: "catalogo"
        label: "Editar catálogo"
        file: "data/catalogo.json"
        format: "json"
        fields:
          - label: "Productos"
            name: "productos"
            widget: "list"
            summary: "{{fields.nombre}} | {{fields.categoria}} › {{fields.subcategoria}} — Q{{fields.precio}}{{fields.sku | ternary(' · SKU ','')}}{{fields.sku}}{{fields.activo | ternary(' · ACTIVO',' · INACTIVO')}}{{fields.destacado | ternary(' · DESTACADO','')}}"
            hint: "Categoría y subcategoría se eligen de una lista: créalas primero en Categorías y Subcategorías si no aparecen. Desactiva 'activo' para ocultar un producto sin borrarlo."
            fields:
              - { label: "Nombre del producto", name: "nombre", widget: "string" }
              - label: "Categoría"
                name: "categoria"
                widget: "relation"
                collection: "categorias"
                search_fields: ["nombre"]
                value_field: "nombre"
                display_fields: ["nombre"]
                hint: "Elige de la lista. Para crear una nueva, ve a Categorías."
              - label: "Subcategoría"
                name: "subcategoria"
                widget: "relation"
                collection: "subcategorias"
                search_fields: ["nombre", "categoria"]
                value_field: "nombre"
                display_fields: ["nombre", "categoria"]
                hint: "Elige de la lista. Para crear una nueva, ve a Subcategorías."
              - { label: "Precio (Q)", name: "precio", widget: "number", value_type: "float", min: 0 }
              - label: "Unidad de venta"
                name: "unidad"
                widget: "select"
                options:
                  - { label: "unidad", value: "unidad" }
                  - { label: "bolsa", value: "bolsa" }
                  - { label: "rollo", value: "rollo" }
                  - { label: "mt2", value: "mt2" }
                  - { label: "pie", value: "pie" }
                default: "unidad"
              - { label: "SKU (opcional)", name: "sku", widget: "string", required: false, hint: "Código interno. Si lo escribes, aparece en el resumen y en la tarjeta del producto." }
              - { label: "Descripción corta", name: "descripcion", widget: "string", required: false }
              - { label: "Activo", name: "activo", widget: "boolean", required: false, default: true, hint: "Visible en la web." }
              - { label: "Destacado", name: "destacado", widget: "boolean", required: false, default: false, hint: "Aparece primero dentro de su subcategoría." }
              - { label: "Imagen (opcional)", name: "imagen", widget: "image", required: false }

  - name: "categorias"
    label: "Categorías"
    label_singular: "categoría"
    description: "Crea primero las categorías: después aparecerán al editar productos."
    icon: "category"
    folder: "data/categorias"
    extension: "json"
    format: "json"
    create: true
    delete: true
    identifier_field: "nombre"
    summary: "{{fields.nombre}}"
    fields:
      - { label: "Nombre de la categoría", name: "nombre", widget: "string", hint: "Ej. FERRETERÍA GENERAL. Escribe siempre el mismo nombre para agrupar productos." }
      - { label: "Imagen de la categoría", name: "imagen", widget: "image", required: false, hint: "Se muestra en la tarjeta de la categoría en el Inicio. Si la dejas vacía, la tarjeta se muestra solo con texto." }

  - name: "subcategorias"
    label: "Subcategorías"
    label_singular: "subcategoría"
    description: "Asigna cada subcategoría a una categoría antes de usarla en productos."
    icon: "label"
    folder: "data/subcategorias"
    extension: "json"
    format: "json"
    create: true
    delete: true
    identifier_field: "nombre"
    summary: "{{fields.nombre}} › {{fields.categoria}}"
    fields:
      - { label: "Nombre de la subcategoría", name: "nombre", widget: "string", hint: "Ej. Herramientas manuales o DESMALEZADORAS." }
      - label: "Categoría a la que pertenece"
        name: "categoria"
        widget: "relation"
        collection: "categorias"
        search_fields: ["nombre"]
        value_field: "nombre"
        display_fields: ["nombre"]

  - name: "servicios"
    label: "Servicios"
    label_singular: "servicio"
    description: "Servicios visibles en la web y botones para abrir su galería de trabajos."
    icon: "design_services"
    files:
      - name: "servicios"
        label: "Editar servicios"
        file: "data/servicios.json"
        format: "json"
        fields:
          - label: "Servicios"
            name: "servicios"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Identificador (slug)", name: "slug", widget: "string", hint: "Ej. vidrieria, herreria, laminas. Se usa para abrir los trabajos de ese servicio." }
              - { label: "Descripción", name: "descripcion", widget: "text" }
              - { label: "Imagen de la tarjeta", name: "imagen", widget: "image", required: false, hint: "Sube una foto real del servicio. No uses iconos: las fotos dan más seriedad." }
              - { label: "Mostrar botón 'Ver trabajos realizados'", name: "verTrabajos", widget: "boolean", default: false, hint: "Actívalo en Vidriería y Herrería para abrir su galería de fotos." }

  - name: "trabajos"
    label: "Trabajos realizados"
    label_singular: "trabajo"
    description: "Fotos de trabajos terminados. Se muestran en el servicio correspondiente."
    icon: "photo_library"
    files:
      - name: "trabajos"
        label: "Editar galería de trabajos"
        file: "data/trabajos.json"
        format: "json"
        fields:
          - label: "Trabajos"
            name: "trabajos"
            widget: "list"
            summary: "{{fields.titulo}} — {{fields.servicio}}"
            hint: "Agrega una entrada por cada trabajo. Sube la foto y escribe una descripción."
            fields:
              - { label: "Título del trabajo", name: "titulo", widget: "string", hint: "Ej. Ventana de aluminio en zona 5" }
              - label: "Servicio"
                name: "servicio"
                widget: "select"
                options:
                  - { label: "Vidriería", value: "vidrieria" }
                  - { label: "Herrería", value: "herreria" }
                  - { label: "Láminas y perfiles", value: "laminas" }
                  - { label: "Moldura", value: "moldura" }
                  - { label: "Ferretería general", value: "ferreteria" }
              - { label: "Descripción", name: "descripcion", widget: "text", hint: "Cuenta qué se hizo, el material usado y el resultado." }
              - { label: "Foto del trabajo", name: "imagen", widget: "image", hint: "Se mostrará en la galería del servicio elegido." }

  - name: "negocio"
    label: "Datos del negocio"
    label_singular: "dato"
    description: "Logo, WhatsApp, dirección, horario y colores del sitio."
    icon: "store"
    files:
      - name: "site"
        label: "Datos, logo y colores"
        file: "data/site.json"
        format: "json"
        fields:
          - { label: "Logotipo", name: "logo", widget: "image", required: false, hint: "Se muestra en la cabecera, el inicio y el pie de página." }
          - { label: "Nombre del negocio", name: "nombre", widget: "string" }
          - { label: "Nombre corto (cabecera)", name: "nombreCorto", widget: "string" }
          - { label: "Subtítulo del logo", name: "subtitulo", widget: "string" }
          - { label: "WhatsApp", name: "whatsapp", widget: "string", hint: "Ej. 4050-7209 o +502 4050 7209. Se usa en todos los botones." }
          - label: "Dirección y contacto"
            name: "contacto"
            widget: "object"
            fields:
              - { label: "Dirección", name: "direccion", widget: "string" }
              - { label: "URL de Google Maps", name: "mapaUrl", widget: "string", hint: "En Google Maps: Compartir → Copiar enlace." }
              - label: "Teléfonos"
                name: "telefonos"
                widget: "list"
                field: { label: "Teléfono", name: "numero", widget: "string" }
              - { label: "Correo electrónico (opcional)", name: "email", widget: "string", required: false }
              - { label: "Horario (opcional)", name: "horario", widget: "string", required: false }
          - label: "Textos del Inicio"
            name: "inicio"
            widget: "object"
            fields:
              - { label: "Título principal", name: "heroTitulo", widget: "string" }
              - { label: "Texto destacado", name: "heroDestacado", widget: "string" }
              - { label: "Párrafo principal", name: "heroLead", widget: "text" }
              - { label: "Título de cotización", name: "ctaTitulo", widget: "string" }
              - { label: "Texto de cotización", name: "ctaTexto", widget: "text" }
              - { label: "Texto del botón", name: "ctaBoton", widget: "string" }
          - label: "Textos de Servicios"
            name: "servicios"
            widget: "object"
            fields:
              - { label: "Título de cotización", name: "ctaTitulo", widget: "string" }
              - { label: "Texto de cotización", name: "ctaTexto", widget: "text" }
              - { label: "Texto del botón", name: "ctaBoton", widget: "string" }
          - label: "Textos de Nosotros"
            name: "nosotros"
            widget: "object"
            fields:
              - { label: "Quiénes somos", name: "texto", widget: "text" }
              - { label: "Nuestro compromiso", name: "compromiso", widget: "text" }
          - label: "Pie de página"
            name: "pie"
            widget: "object"
            fields:
              - { label: "Descripción", name: "descripcion", widget: "string" }
          - label: "Colores del sitio"
            name: "colores"
            widget: "object"
            hint: "Elige los colores con el selector o escribe el código hexadecimal."
            fields:
              - { label: "Fondo principal", name: "fondo1", widget: "color", allowInput: true }
              - { label: "Fondo medio", name: "fondo2", widget: "color", allowInput: true }
              - { label: "Fondo claro", name: "fondo3", widget: "color", allowInput: true }
              - { label: "Color principal", name: "acento", widget: "color", allowInput: true }
              - { label: "Color principal (tono 2)", name: "acento2", widget: "color", allowInput: true }
              - { label: "Color secundario", name: "secundario", widget: "color", allowInput: true }
              - { label: "Color secundario (tono 2)", name: "secundario2", widget: "color", allowInput: true }
              - { label: "Color del texto", name: "texto", widget: "color", allowInput: true }
              - { label: "Color de texto secundario", name: "textoSuave", widget: "color", allowInput: true }
              - { label: "Color de WhatsApp", name: "wa", widget: "color", allowInput: true }

  - name: "paginas"
    label: "Textos de las páginas"
    label_singular: "texto"
    description: "Títulos y párrafos de Inicio, Productos, Servicios, Nosotros y Contacto."
    icon: "article"
    files:
      - name: "paginas"
        label: "Editar textos de las páginas"
        file: "data/paginas.json"
        format: "json"
        fields:
          - label: "Inicio"
            name: "inicio"
            widget: "object"
            fields:
              - { label: "Texto pequeño sobre el título", name: "eyebrow", widget: "string" }
              - { label: "Título: primera parte", name: "categoriasTitulo1", widget: "string" }
              - { label: "Título: palabra destacada", name: "categoriasTitulo2", widget: "string" }
              - { label: "Bajada de categorías", name: "categoriasIntro", widget: "string" }
              - { label: "Título 'Por qué': primera parte", name: "porQueTitulo1", widget: "string" }
              - { label: "Título 'Por qué': palabra destacada", name: "porQueTitulo2", widget: "string" }
              - label: "Tarjetas de 'Por qué elegirnos'"
                name: "ventajas"
                widget: "list"
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Imagen de la tarjeta", name: "imagen", widget: "image", required: false, hint: "Sube una foto real. Si la dejas vacía, la tarjeta se muestra solo con texto." }
                  - { label: "Título", name: "titulo", widget: "string" }
                  - { label: "Texto", name: "texto", widget: "text" }
              - { label: "Texto del botón 'Ver productos'", name: "botonProductos", widget: "string" }
              - { label: "Texto del botón 'Contáctanos'", name: "botonContacto", widget: "string" }
              - { label: "Texto debajo de cada categoría", name: "verCategoria", widget: "string" }
          - label: "Productos"
            name: "productos"
            widget: "object"
            fields:
              - { label: "Título: primera parte", name: "titulo1", widget: "string" }
              - { label: "Título: palabra destacada", name: "titulo2", widget: "string" }
              - { label: "Texto de presentación", name: "intro", widget: "text", hint: "Ej. Precios en Quetzales. Para confirmar existencias o pedir cotización, escríbenos por WhatsApp." }
              - { label: "Texto del buscador", name: "buscador", widget: "string" }
              - { label: "Mensaje cuando no hay resultados", name: "vacio", widget: "string" }
          - label: "Servicios"
            name: "servicios"
            widget: "object"
            fields:
              - { label: "Título: primera parte", name: "titulo1", widget: "string" }
              - { label: "Título: palabra destacada", name: "titulo2", widget: "string" }
              - { label: "Texto de presentación", name: "intro", widget: "string" }
              - { label: "Mensaje cuando no hay servicios", name: "vacio", widget: "string" }
              - { label: "Texto del botón 'Ver trabajos'", name: "verTrabajos", widget: "string" }
          - label: "Trabajos realizados"
            name: "trabajos"
            widget: "object"
            fields:
              - { label: "Título: primera parte", name: "titulo1", widget: "string" }
              - { label: "Título: palabra destacada", name: "titulo2", widget: "string" }
              - { label: "Texto de presentación", name: "intro", widget: "text" }
              - { label: "Mensaje cuando no hay trabajos", name: "vacio", widget: "string" }
              - { label: "Texto del enlace para volver", name: "volver", widget: "string" }
              - { label: "Texto del botón de cotización", name: "boton", widget: "string" }
          - label: "Nosotros"
            name: "nosotros"
            widget: "object"
            fields:
              - { label: "Título: primera parte", name: "titulo1", widget: "string" }
              - { label: "Título: palabra destacada", name: "titulo2", widget: "string" }
              - { label: "Texto de presentación", name: "intro", widget: "string" }
              - { label: "Título de la tarjeta de compromiso", name: "compromisoTitulo", widget: "string" }
              - label: "Tarjetas de valores"
                name: "valores"
                widget: "list"
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Imagen de la tarjeta", name: "imagen", widget: "image", required: false, hint: "Sube una foto real. Si la dejas vacía, la tarjeta se muestra solo con texto." }
                  - { label: "Título", name: "titulo", widget: "string" }
                  - { label: "Texto", name: "texto", widget: "text" }
          - label: "Contacto"
            name: "contacto"
            widget: "object"
            fields:
              - { label: "Título destacado", name: "titulo2", widget: "string" }
              - { label: "Texto de presentación", name: "intro", widget: "string" }
              - { label: "Título de datos de contacto", name: "datosTitulo", widget: "string" }
              - { label: "Título del formulario", name: "formTitulo", widget: "string" }
              - { label: "Etiqueta del nombre", name: "nombreLabel", widget: "string" }
              - { label: "Etiqueta del mensaje", name: "mensajeLabel", widget: "string" }
              - { label: "Texto del botón", name: "boton", widget: "string" }
          - label: "Menú y pie de página"
            name: "comun"
            widget: "object"
            fields:
              - label: "Nombres del menú"
                name: "nav"
                widget: "object"
                fields:
                  - { label: "Inicio", name: "inicio", widget: "string" }
                  - { label: "Productos", name: "productos", widget: "string" }
                  - { label: "Servicios", name: "servicios", widget: "string" }
                  - { label: "Nosotros", name: "nosotros", widget: "string" }
                  - { label: "Contacto", name: "contacto", widget: "string" }
              - { label: "Título 'Ubicación' en el pie", name: "footerUbicacion", widget: "string" }
              - { label: "Título 'Teléfonos' en el pie", name: "footerTelefonos", widget: "string" }
              - { label: "Texto del enlace del mapa", name: "verMapa", widget: "string" }
